[project]
name = "call_me_maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
requires-python = ">=3.10"

dependencies = [
    "flake8>=7.3.0",
    "mypy>=1.0.0",
    "pydantic>=2.0",
    "ruff>=0.15.2",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "numpy>=2.2.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false
